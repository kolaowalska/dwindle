[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwindle"
version = "0.1.0"
description = "a research environment for evaluating graph reduction algorithms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "RUF"]
ignore = ["E701", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/demo.py" = ["E402"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[project.scripts]
dwindle = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.data" = ["*.edgelist"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
